# .github/workflows/flake-update.yml
name: Update flake.lock

on:
  schedule:
    - cron: '0 1 * * *'
      timezone: 'Asia/Jakarta'
  workflow_dispatch:

jobs:
  update:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v7

      - uses: DeterminateSystems/nix-installer-action@v23

      - name: Update flake.lock
        run: nix flake update

      # a lock bump that breaks any host must not reach main
      - name: Evaluate every host
        run: |
          for h in desktop delta nixos-test; do
            nix eval --raw ".#nixosConfigurations.$h.config.system.build.toplevel.drvPath" > /dev/null
          done

      - name: Commit and push
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add flake.lock
          git diff --cached --quiet && exit 0
          git commit -m "flake: update flake.lock"
          git push
